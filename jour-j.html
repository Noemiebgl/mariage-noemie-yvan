</style></head><body><main class="scene" aria-label="Programme du mariage"><div class="timeline"><div class="step"><div class="symbol"><img src="https://noemiebgl.github.io/mariage-noemie-yvan/images/ceremonie.png" alt="" /></div><span class="dot"></span><div class="copy"><div class="name">CÉRÉMONIE</div><div class="time">Horaire à venir</div></div></div>
<div class="step"><div class="symbol"><img src="https://noemiebgl.github.io/mariage-noemie-yvan/images/photos.png" alt="" /></div><span class="dot"></span><div class="copy"><div class="name">PHOTOS</div><div class="time">Horaire à venir</div></div></div>
<div class="step"><div class="symbol"><img src="https://noemiebgl.github.io/mariage-noemie-yvan/images/cocktail.png" alt="" /></div><span class="dot"></span><div class="copy"><div class="name">COCKTAIL</div><div class="time">Horaire à venir</div></div></div>

<div class="step"><div class="symbol"><img src="https://noemiebgl.github.io/mariage-noemie-yvan/images/soiree.png" alt="" /></div><span class="dot"></span><div class="copy"><div class="name">SOIRÉE DANSANTE !</div><div class="time">Horaire à venir</div></div></div></div></main><style>
